version: 2
updates:
  # The vendored code under vendor/ is not here. Each submodule is pinned to an upstream
  # release tag, and Dependabot's gitsubmodule updates would propose a branch's newest
  # commit instead; .github/workflows/submodule-tags-check.yml watches the tags, and
  # .github/workflows/stb-freshness-check.yml the two copied-in stb headers. See
  # SECURITY.md, "Vendored dependencies".

  # Keep the Actions themselves (actions/checkout, upload-artifact, etc.) current.
  # Every `uses:` names a full commit SHA, with the release it is in a trailing
  # comment: a tag can be moved by the action's owner, a SHA cannot. Dependabot
  # updates the SHA and the comment together.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "ci"
