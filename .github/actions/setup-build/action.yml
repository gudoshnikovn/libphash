# The prologue shared by every build job in ci.yml: fetch the vendored decoder
# submodules and install the job's build dependencies from the platform's package
# manager. One definition, so a change to how that is done (a new package, a retry,
# a mirror) is made once.
#
# It cannot include the checkout itself: a local action is read from the working
# copy, so `actions/checkout` has to run before `uses: ./.github/actions/setup-build`
# can resolve. Jobs keep a plain checkout (no `submodules:`) and call this right
# after it. Configure stays in the jobs as well -- its arguments are the part that
# differs from job to job, which is exactly what should stay visible there.
name: Set up build
description: Fetch vendored submodules and install build dependencies (apt on Linux, Homebrew on macOS).

inputs:
  path:
    description: Checkout to operate on, relative to the workspace (for jobs that check out more than one tree).
    default: '.'
  submodules:
    description: Fetch the vendored decoder submodules (recursive). 'false' for stb-only jobs that never read vendor/.
    default: 'true'
  apt-packages:
    description: Space-separated apt packages to install on Linux. Empty skips apt entirely.
    default: cmake
  apt-architectures:
    description: Extra dpkg architectures to enable before installing (e.g. i386 for a -m32 build).
    default: ''
  brew-packages:
    description: Space-separated Homebrew formulae to install on macOS. Empty skips Homebrew.
    default: cmake
  ccache:
    description: >-
      'true' compiles through ccache with a cache kept between runs (Linux only).
      For jobs that build the vendored decoders or an instrumented tree, where the same
      sources compile identically run after run.
    default: 'false'
  ccache-key:
    description: Distinguishes the cache of each matrix leg of a job (the leg's name).
    default: ''

runs:
  using: composite
  steps:
    - name: Fetch submodules
      if: inputs.submodules == 'true'
      shell: bash
      working-directory: ${{ inputs.path }}
      run: git submodule update --init --recursive --depth 1

    - name: Install dependencies (Linux)
      if: runner.os == 'Linux' && (inputs.apt-packages != '' || inputs.ccache == 'true')
      shell: bash
      env:
        APT_PACKAGES: ${{ inputs.apt-packages }}${{ inputs.ccache == 'true' && ' ccache' || '' }}
        APT_ARCHITECTURES: ${{ inputs.apt-architectures }}
      run: |
        for arch in $APT_ARCHITECTURES; do
          sudo dpkg --add-architecture "$arch"
        done
        sudo apt-get update
        # Word splitting is the point here: one package per word.
        # shellcheck disable=SC2086
        sudo apt-get install -y $APT_PACKAGES

    - name: Install dependencies (macOS)
      if: runner.os == 'macOS' && inputs.brew-packages != ''
      shell: bash
      env:
        BREW_PACKAGES: ${{ inputs.brew-packages }}
      # shellcheck disable=SC2086
      run: brew install $BREW_PACKAGES

    # ccache returns an object only for the same preprocessed source, compiler and flags,
    # so a hit is the object a compile would have produced. Each run saves its own entry
    # (the key ends in the commit) and restores the newest one of its job and leg; GitHub
    # evicts the oldest entries past the repository's cache quota.
    - name: Restore ccache
      if: runner.os == 'Linux' && inputs.ccache == 'true'
      uses: actions/cache@v6
      with:
        path: ${{ runner.temp }}/ccache
        key: ccache-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ inputs.ccache-key }}-${{ github.sha }}
        restore-keys: ccache-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ inputs.ccache-key }}-

    - name: Compile through ccache
      if: runner.os == 'Linux' && inputs.ccache == 'true'
      shell: bash
      # CMake takes its compiler launcher from these variables on first configure, in
      # the vendored decoders' builds as well as the library's.
      run: |
        {
          echo "CCACHE_DIR=$RUNNER_TEMP/ccache"
          echo "CCACHE_MAXSIZE=500M"
          echo "CMAKE_C_COMPILER_LAUNCHER=ccache"
          echo "CMAKE_CXX_COMPILER_LAUNCHER=ccache"
        } >> "$GITHUB_ENV"
