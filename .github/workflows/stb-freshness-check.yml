name: stb freshness check

# The two copied-in stb headers (vendor/stb_image.h, vendor/stb_image_resize2.h)
# aren't git submodules, so Dependabot (.github/dependabot.yml) can't see when
# nothings/stb moves on. This runs scripts/check_stb_freshness.sh on a schedule and
# opens (or updates) a tracking issue when a header is stale, rather than failing the
# run -- see SECURITY.md's "Vendored dependencies" section for why a bump isn't a
# drop-in file replacement. A check that cannot run at all does fail the run.

on:
  schedule:
    - cron: '0 6 1 * *' # first of the month
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Check stb header freshness
        id: check
        # 0 fresh, 1 stale (tracking issue below), anything else means the check
        # could not run -- see the header of scripts/check_stb_freshness.sh.
        run: |
          set +e
          bash scripts/check_stb_freshness.sh > "$RUNNER_TEMP/stb-freshness.txt"
          status=$?
          set -e
          cat "$RUNNER_TEMP/stb-freshness.txt"
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Fail if the check could not run
        if: steps.check.outputs.status != '0' && steps.check.outputs.status != '1'
        run: |
          echo "::error::scripts/check_stb_freshness.sh exited with ${{ steps.check.outputs.status }}: the freshness check itself is broken"
          exit 1

      - name: Open or update tracking issue
        if: steps.check.outputs.status == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="vendor/stb_image*.h are behind upstream nothings/stb"
          body="$RUNNER_TEMP/stb-freshness-issue.md"
          {
            cat <<'EOF'
          Detected by the scheduled `stb-freshness-check` workflow.

          ```
          EOF
            cat "$RUNNER_TEMP/stb-freshness.txt"
            cat <<'EOF'
          ```

          Bumping either file means reapplying the local OOM-handling patches and
          re-verifying them against `tests/src/test_alloc_failure.c` -- see SECURITY.md's
          "Vendored dependencies" section and `docs/development.md`. It is not a drop-in
          file replacement.
          EOF
          } > "$body"
          # The label is created on first use, so the workflow does not depend on
          # repository settings made by hand.
          gh label create dependencies --color 0366d6 \
            --description "Vendored code and dependency updates" 2> /dev/null || true
          existing=$(gh issue list --search "in:title \"$title\"" --state open \
            --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file "$body"
          else
            gh issue create --title "$title" --body-file "$body" --label dependencies
          fi
