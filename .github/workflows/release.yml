name: Release

# Publishes prebuilt release artifacts (static + shared libs, headers, LICENSE,
# THIRD-PARTY-NOTICES.md) so a consumer, in particular any FFI binding, doesn't
# have to build the vendored decoder stack itself.
#
# Two trigger shapes:
#  - push of a `v*` tag: builds, packages, smoke-tests, then publishes a GitHub
#    Release. A tag containing `-` (e.g. v2.0.0-rc1) is published as a GitHub
#    pre-release, through exactly the same path production tags use.
#  - workflow_dispatch: same build+package+smoke pipeline, uploaded as
#    ordinary workflow artifacts, no GitHub Release created. Note that GitHub
#    registers workflow_dispatch from the *default branch* copy of this file,
#    so it works only when the default branch's copy declares it. To validate
#    the pipeline from a branch, push a throwaway tag containing `-` (published
#    as a GitHub pre-release, see above).
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

# Read-only by default: only publish writes, and only it gets the token that can.
permissions:
  contents: read

# Two runs for the same tag would race to create one GitHub Release. The second
# waits instead of cancelling the first: an interrupted publish is worse than a late one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Same release decoder set as CI's build-and-test job and scripts/coverage_cmake.sh's
  # "native" leg: libjpeg-turbo + libpng + libwebp + zlib-ng, PHASH_STRICT_DEPS=ON so a
  # silently-missing backend fails the build instead of shipping a quietly
  # degraded artifact.
  # macos-x86_64 (the macos-13 runner label) is deliberately not in this matrix:
  # GitHub's Intel-Mac hosted runner pool is small enough that jobs sit queued
  # for 20+ minutes with no runner assigned. macos-arm64 builds from the same
  # recipe and ships instead.
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            os: ubuntu-24.04
            needs_nasm: true
          - platform: linux-arm64
            os: ubuntu-24.04-arm
            needs_nasm: false
          - platform: macos-arm64
            os: macos-latest
            needs_nasm: false
          - platform: windows-x86_64
            os: windows-latest
            needs_nasm: true
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    name: build (${{ matrix.platform }})
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        submodules: recursive

    - name: Install NASM (Linux)
      if: matrix.needs_nasm && runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y nasm cmake

    - name: Install dependencies (Linux, no NASM needed)
      if: (!matrix.needs_nasm) && runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake

    - name: Install dependencies (macOS)
      if: runner.os == 'macOS'
      run: brew install cmake nasm

    - name: Install NASM (Windows)
      if: runner.os == 'Windows'
      shell: bash
      run: |
        choco install nasm --no-progress -y
        echo "C:\\Program Files\\NASM" >> "$GITHUB_PATH"

    - name: Package release archives (static + shared)
      shell: bash
      run: scripts/package_release.sh ${{ matrix.platform }} dist both

    - name: Upload archives
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: dist-${{ matrix.platform }}
        path: dist/*
        if-no-files-found: error

  # Extracts each archive in isolation (no access to the build tree above --
  # see scripts/smoke_release_artifact.sh) and links a minimal consumer
  # against it via find_package(phash), on the same OS family it was built on.
  smoke:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            os: ubuntu-24.04
          - platform: linux-arm64
            os: ubuntu-24.04-arm
          - platform: macos-arm64
            os: macos-latest
          - platform: windows-x86_64
            os: windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    name: smoke (${{ matrix.platform }})
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Download archives
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: dist-${{ matrix.platform }}
        path: dist

    # One glob per archive kind: .tar.gz on Unix, .zip on Windows, and the static
    # pattern cannot match the -shared name. nullglob makes the kind that is absent
    # expand to nothing, so the first element is the archive; none at all reaches
    # smoke_release_artifact.sh as an empty path, which it reports.
    - name: Smoke test static archive
      shell: bash
      run: |
        shopt -s nullglob
        archives=(dist/libphash-*-${{ matrix.platform }}.tar.gz dist/libphash-*-${{ matrix.platform }}.zip)
        scripts/smoke_release_artifact.sh "${archives[0]:-}" static

    - name: Smoke test shared archive
      shell: bash
      run: |
        shopt -s nullglob
        archives=(dist/libphash-*-${{ matrix.platform }}-shared.tar.gz dist/libphash-*-${{ matrix.platform }}-shared.zip)
        scripts/smoke_release_artifact.sh "${archives[0]:-}" shared

    # The shared library in the archive carries the decoders the release is built with,
    # statically, and no dynamic dependency on a system decoder library. nm/readelf/otool:
    # Linux and macOS.
    - name: Check the shared library's decoders
      if: runner.os != 'Windows'
      shell: bash
      env:
        PH_EXPECT_BUILD: jpeg=libjpeg-turbo png=libpng webp=libwebp zlib=zlib-ng
      run: |
        mkdir -p unpacked
        tar -xzf dist/libphash-*-${{ matrix.platform }}-shared.tar.gz -C unpacked
        lib=$(find unpacked -type f \( -name 'libphash.so.*.*.*' -o -name 'libphash.*.*.*.dylib' \) | head -n1)
        scripts/check_decoder_symbols.sh "$lib"

  checksums:
    needs: smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - name: Download all archives
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        pattern: dist-*
        path: dist
        merge-multiple: true

    - name: Compute SHA256SUMS.txt
      run: |
        cd dist
        sha256sum -- * > SHA256SUMS.txt
        cat SHA256SUMS.txt

    - name: Upload combined artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: dist-all
        path: |
          dist/*
        if-no-files-found: error

  # Only on an actual tag push -- workflow_dispatch runs stop at the checksums
  # job above so this pipeline can be exercised on a branch without a GitHub
  # Release appearing.
  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: checksums
    runs-on: ubuntu-24.04
    # contents: write to create the release; id-token and attestations: write to sign
    # and store the build provenance below. No other job holds any of the three.
    permissions:
      contents: write
      id-token: write
      attestations: write
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Download all archives
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: dist-all
        path: dist

    - name: Extract CHANGELOG section for this tag
      id: notes
      run: |
        tag="${GITHUB_REF#refs/tags/v}"
        awk -v ver="$tag" '
          $0 ~ "^## \\[" ver "\\]" { found=1; print; next }
          found && /^## \[/ { exit }
          found { print }
        ' CHANGELOG.md > release_notes.md
        if [ ! -s release_notes.md ]; then
          echo "No CHANGELOG.md section found for [$tag], falling back to a generic note" >&2
          echo "See CHANGELOG.md for details." > release_notes.md
        fi

    # Build provenance for every archive: a statement, signed with a certificate GitHub
    # issues to this run alone and recorded in the public Sigstore transparency log, that
    # the file with this SHA-256 was built by this workflow from this repository at this
    # commit and tag. SHA256SUMS.txt only shows a download is intact -- it is served from
    # the same place as the archives, so whoever could replace one could replace both.
    # `gh attestation verify <archive> --repo <owner>/libphash` checks it (SECURITY.md).
    - name: Attest build provenance
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
      with:
        subject-path: |
          dist/*.tar.gz
          dist/*.zip

    # Idempotent: a rerun for the same tag -- after a failure past this point, or to
    # replace an archive -- updates the existing release instead of failing on
    # "release already exists" and discarding four platforms' builds. --verify-tag
    # refuses to create a release (and with it a tag) for a tag that is not pushed.
    - name: Create or update the GitHub Release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        tag="${GITHUB_REF#refs/tags/}"
        prerelease_flag=()
        case "$tag" in *-*) prerelease_flag=(--prerelease) ;; esac
        if gh release view "$tag" > /dev/null 2>&1; then
          gh release upload "$tag" dist/* --clobber
          gh release edit "$tag" --title "$tag" --notes-file release_notes.md "${prerelease_flag[@]}"
        else
          gh release create "$tag" dist/* --verify-tag --title "$tag" \
            --notes-file release_notes.md "${prerelease_flag[@]}"
        fi
