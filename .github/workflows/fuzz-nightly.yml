name: Fuzz (nightly)

# The fuzz job in ci.yml only gets a 90s budget, which is there to catch a regression
# fast, not to explore the input space. This is the long run that does. It runs on the
# default branch, so the corpus it saves to the cache is the one every branch's CI run
# can restore; it starts from the newest corpus saved on the default branch.
on:
  schedule:
    - cron: '0 3 * * *' # 03:00 UTC daily
  workflow_dispatch: {}

permissions:
  contents: read

# A manual run started during the nightly one waits for it, so the two do not save
# competing corpus caches from the same starting point.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  fuzz-nightly:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CC: clang
      ASAN_OPTIONS: halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        submodules: recursive

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake clang nasm

    - name: Configure CMake (fuzzers)
      run: cmake --preset fuzz

    - name: Build
      run: cmake --build --preset fuzz --target fuzz_load

    # Same cache entries as the fuzz job in ci.yml (fuzz-corpus-*); see the comment
    # there for how the key and restore-keys work.
    - name: Restore fuzz corpus cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: tests/fuzz/corpus
        key: fuzz-corpus-${{ github.run_id }}
        restore-keys: |
          fuzz-corpus-

    - name: Run fuzz_load (30 minute session)
      run: |
        mkdir -p /tmp/fuzz-artifacts tests/fuzz/corpus
        ./build/fuzz/fuzz_load -max_total_time=1800 -max_len=65536 -dict=tests/fuzz/magic.dict \
          -artifact_prefix=/tmp/fuzz-artifacts/ tests/fuzz/corpus tests/fuzz/seeds

    - name: Minimize the corpus
      run: |
        mkdir -p /tmp/corpus-min
        ./build/fuzz/fuzz_load -merge=1 -max_len=65536 /tmp/corpus-min tests/fuzz/corpus
        echo "corpus: $(find tests/fuzz/corpus -type f | wc -l) units, $(find /tmp/corpus-min -type f | wc -l) after -merge=1"
        rm -rf tests/fuzz/corpus
        mv /tmp/corpus-min tests/fuzz/corpus

    # A cache entry nobody restores for 7 days is evicted, so the corpus is also kept as
    # an artifact: a starting point for a local run, or for CI should the cache be gone
    # (download it into tests/fuzz/corpus/).
    - name: Upload the minimized corpus
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: fuzz-corpus
        path: tests/fuzz/corpus/
        retention-days: 90
        if-no-files-found: error

    - name: Upload crash artifacts
      if: failure()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: fuzz-nightly-crashes
        path: /tmp/fuzz-artifacts/
