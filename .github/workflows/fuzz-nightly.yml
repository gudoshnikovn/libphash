name: Fuzz (nightly)

# The fuzz job in ci.yml only gets a 90s budget, which is there to
# catch a regression fast, not to actually explore the input space. This is the
# long run that does that -- it shares the same growing corpus cache, so each
# night builds on every previous night's (and every CI run's) findings instead of
# starting cold.
on:
  schedule:
    - cron: '0 3 * * *' # 03:00 UTC daily
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  fuzz-nightly:
    runs-on: ubuntu-24.04
    env:
      CC: clang
      ASAN_OPTIONS: halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake clang nasm

    - name: Configure CMake (fuzzers)
      run: cmake --preset fuzz

    - name: Build
      run: cmake --build --preset fuzz --target fuzz_load

    # Same cache lineage as the fuzz job in ci.yml -- both read and write
    # fuzz-corpus-*, so a corpus entry either job finds benefits the other.
    - name: Restore fuzz corpus cache
      uses: actions/cache@v6
      with:
        path: tests/fuzz/corpus
        key: fuzz-corpus-${{ github.run_id }}
        restore-keys: |
          fuzz-corpus-

    - name: Run fuzz_load (30 minute session)
      run: |
        mkdir -p /tmp/fuzz-artifacts tests/fuzz/corpus
        ./build/fuzz/fuzz_load -max_total_time=1800 -dict=tests/fuzz/magic.dict \
          -artifact_prefix=/tmp/fuzz-artifacts/ tests/fuzz/corpus tests/data

    - name: Upload crash artifacts
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: fuzz-nightly-crashes
        path: /tmp/fuzz-artifacts/
