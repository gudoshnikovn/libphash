name: Decoder benchmark

# A one-off measurement: what libjpeg-turbo, libpng and zlib-ng buy over the stb_image
# fallback, on Linux x86-64 and arm64, from scripts/bench_decoders.sh. It runs on a
# push to its own branch only.
on:
  push:
    branches: [ feature/decoder-benchmark ]

permissions:
  contents: read

jobs:
  bench:
    strategy:
      fail-fast: false
      matrix:
        runner: [ ubuntu-latest, ubuntu-24.04-arm ]
    runs-on: ${{ matrix.runner }}
    steps:
    - uses: actions/checkout@v4

    - name: Set up build (submodules + dependencies)
      uses: ./.github/actions/setup-build
      with:
        apt-packages: cmake nasm jq zlib1g-dev time

    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Generate corpus
      run: |
        pip install pillow numpy
        python scripts/gen_bench_corpus.py tests/data/photo_large.jpeg corpus

    - name: Run benchmark
      run: |
        lscpu | grep -E 'Model name' || true
        bash scripts/bench_decoders.sh corpus work 7 result.md
        cat result.md >> "$GITHUB_STEP_SUMMARY"

    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: decoder-bench-${{ matrix.runner }}
        path: |
          result.md
          work/raw.tsv
