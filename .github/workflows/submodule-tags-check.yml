name: submodule tags check

# The four vendored submodules (.gitmodules) are each pinned to an upstream release tag.
# Dependabot cannot keep them there -- its gitsubmodule updates follow a branch's newest
# commit, not its tags -- so this runs scripts/check_submodule_tags.sh on a schedule and
# opens (or updates) a tracking issue when a submodule is behind upstream's newest
# release or not on a release tag at all, rather than failing the run: a bump is a
# reviewed task (SECURITY.md, "Vendored dependencies"). A check that cannot run at all
# does fail the run.

on:
  schedule:
    - cron: '0 6 * * 1' # Mondays
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

# Two overlapping runs would both find no open issue and both open one.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check submodule tags
        id: check
        # 0 on the newest release tags, 1 behind or untagged (tracking issue below),
        # anything else means the check could not run -- see the header of
        # scripts/check_submodule_tags.sh.
        run: |
          set +e
          bash scripts/check_submodule_tags.sh > "$RUNNER_TEMP/submodule-tags.txt"
          status=$?
          set -e
          cat "$RUNNER_TEMP/submodule-tags.txt"
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Fail if the check could not run
        if: steps.check.outputs.status != '0' && steps.check.outputs.status != '1'
        run: |
          echo "::error::scripts/check_submodule_tags.sh exited with ${{ steps.check.outputs.status }}: the tags check itself is broken"
          exit 1

      - name: Open or update tracking issue
        if: steps.check.outputs.status == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="A vendored submodule is not on its upstream's newest release tag"
          body="$RUNNER_TEMP/submodule-tags-issue.md"
          {
            cat <<'EOF'
          Detected by the scheduled `submodule-tags-check` workflow.

          ```
          EOF
            cat "$RUNNER_TEMP/submodule-tags.txt"
            cat <<'EOF'
          ```

          A bump moves the submodule to the new release tag, updates its version in
          `THIRD-PARTY-NOTICES.md` and runs the whole CI matrix; a decoder change can move
          decoded pixels, which `tests/src/test_golden_hashes.c` would show.
          EOF
          } > "$body"
          # The label is created on first use, so the workflow does not depend on
          # repository settings made by hand.
          gh label create dependencies --color 0366d6 \
            --description "Vendored code and dependency updates" 2> /dev/null || true
          existing=$(gh issue list --search "in:title \"$title\"" --state open \
            --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file "$body"
          else
            gh issue create --title "$title" --body-file "$body" --label dependencies
          fi
