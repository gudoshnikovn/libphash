name: CI

on:
  push:
    branches: [ main, 'release/**' ]
  pull_request:
    branches: [ main, 'release/**' ]
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: write

jobs:
  # R26: fast, no submodules/build needed -- catches an unformatted diff before
  # the much slower legs below spend minutes on it. .clang-format already backs
  # `make format`; this is the same check, just enforced.
  format-check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install clang-format
      run: |
        sudo apt-get update
        sudo apt-get install -y clang-format

    - name: clang-format --dry-run --Werror
      run: find src tests/src include -name "*.c" -o -name "*.h" | xargs clang-format --dry-run --Werror

  # Full vendored build (all bundled decoders) across the platforms/arches we
  # actually ship for. PHASH_STRICT_DEPS=ON turns a silent decoder fallback
  # (e.g. TurboJPEG not found) into a hard configure failure, so a CI green
  # here means the vendored decoders were genuinely built and linked, not
  # quietly swapped for stb_image (see tasks/PROGRESS.md known bugs, task 7).
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-x86_64-gcc
            os: ubuntu-latest
            needs_nasm: true
            cc: gcc
          - name: ubuntu-x86_64-clang
            os: ubuntu-latest
            needs_nasm: true
            cc: clang
          - name: ubuntu-arm64-gcc
            os: ubuntu-24.04-arm
            needs_nasm: false
            cc: gcc
          - name: macos-arm64-clang
            os: macos-latest
            needs_nasm: false
            cc: clang
          # R26: spng is the other PNG backend (src/loaders/png.c compiles exactly
          # one of libpng/spng), and until this leg it was never actually built
          # in CI even though the R49 grayscale-decode fix specifically touched
          # its path.
          - name: ubuntu-x86_64-gcc-spng
            os: ubuntu-latest
            needs_nasm: true
            cc: gcc
            extra_cmake_args: -DPHASH_USE_SPNG=ON -DPHASH_USE_LIBPNG=OFF
    runs-on: ${{ matrix.os }}
    name: build-and-test (${{ matrix.name }})
    env:
      CC: ${{ matrix.cc }}
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake${{ matrix.needs_nasm && ' nasm' || '' }}${{ matrix.cc == 'clang' && ' clang' || '' }}

    - name: Install dependencies (macOS)
      if: runner.os == 'macOS'
      run: brew install cmake

    # libjpeg-turbo doesn't like add_subdirectory (see CMakeLists.txt), so its
    # submodule is built separately; the main configure below then finds the
    # resulting static lib in vendor/libjpeg-turbo/build.
    - name: Build vendored TurboJPEG
      run: |
        cmake -S vendor/libjpeg-turbo -B vendor/libjpeg-turbo/build -DCMAKE_BUILD_TYPE=Release -DENABLE_SHARED=OFF
        cmake --build vendor/libjpeg-turbo/build --target turbojpeg-static -j

    - name: Configure CMake (full vendored build)
      run: cmake -B build -DPHASH_BUILD_TESTS=ON -DPHASH_STRICT_DEPS=ON -DCMAKE_BUILD_TYPE=Release ${{ matrix.extra_cmake_args }}

    - name: Build
      run: cmake --build build --config Release -j

    - name: Run Tests
      run: cd build && ctest --output-on-failure

  # R24: `make coverage` (Makefile) only measures the stb_image-only path -- none
  # of src/loaders/{jpeg,png,webp}.c's native decoding code (the #ifdef PH_USE_*
  # bodies) exists in that binary at all, just their ph_can_use_*() stub. This job
  # runs scripts/coverage_cmake.sh, which drives the vendored decoder build (plus
  # a separate spng pass) under -DPHASH_COVERAGE=ON and merges both lcov traces,
  # then publishes the merged HTML report as an artifact. See
  # docs/development.md#two-coverage-targets-and-why-one-isnt-enough-r24.
  coverage-cmake:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake nasm lcov

    - name: Build vendored TurboJPEG
      run: |
        cmake -S vendor/libjpeg-turbo -B vendor/libjpeg-turbo/build -DCMAKE_BUILD_TYPE=Release -DENABLE_SHARED=OFF
        cmake --build vendor/libjpeg-turbo/build --target turbojpeg-static -j

    - name: Run coverage-cmake
      run: ./scripts/coverage_cmake.sh

    - name: Upload coverage report
      uses: actions/upload-artifact@v4
      with:
        name: coverage-cmake-html
        path: docs/coverage/cmake/html/
        retention-days: 14

  # Zero-dependency build: every PHASH_USE_* backend off, stb_image only.
  minimal-build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    name: minimal-build (${{ matrix.os }})
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Configure CMake (minimal, stb_image only)
      run: >
        cmake -B build -DPHASH_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Release
        -DPHASH_USE_TURBOJPEG=OFF -DPHASH_USE_LIBPNG=OFF -DPHASH_USE_WEBP=OFF -DPHASH_USE_ZLIB_NG=OFF

    - name: Build
      run: cmake --build build --config Release

    - name: Run Tests
      run: cd build && ctest -C Release --output-on-failure

  # R26: most overflow findings from this review (e.g. pixel-count overflow, PNG
  # row_ptrs overflow) trigger at much smaller inputs on a 32-bit size_t/int than on
  # 64-bit -- the matrix above never exercised that width at all. Scoped to the
  # native PNG backend (libpng) plus system zlib, not the full vendored set: cross-
  # building TurboJPEG/zlib-ng's own NASM-based 32-bit SIMD and libwebp under -m32
  # is a much larger, separate lift, and this backend already links the one native
  # decoder (src/loaders/png.c) that the overflow fixes this leg exists to guard
  # (R03/R17) live in.
  build-and-test-32bit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install 32-bit toolchain and zlib
      run: |
        sudo dpkg --add-architecture i386
        sudo apt-get update
        sudo apt-get install -y cmake gcc-multilib g++-multilib zlib1g-dev:i386

    - name: Configure CMake (32-bit, libpng)
      run: >
        cmake -B build -DPHASH_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Release
        -DPHASH_USE_TURBOJPEG=OFF -DPHASH_USE_LIBPNG=ON -DPHASH_USE_WEBP=OFF -DPHASH_USE_ZLIB_NG=OFF
        -DCMAKE_C_FLAGS=-m32 -DCMAKE_EXE_LINKER_FLAGS=-m32 -DCMAKE_SYSTEM_PROCESSOR=i686

    - name: Build
      run: cmake --build build --config Release -j

    - name: Confirm this is actually a 32-bit build
      run: file build/test_version | grep -q "ELF 32-bit"

    - name: Run Tests
      run: cd build && ctest --output-on-failure

  # Task 16: compares the PR (or, on a plain push -- this repo's internal
  # feature/... -> release/vX.Y.Z flow never opens a GitHub PR, see R77 --
  # the pushed commit) against its base commit built in this same job (not
  # against hardcoded numbers) to keep GH-hosted-runner noise out of the
  # comparison -- see tasks/16_benchmark_regression_gate.md. Warning-only for
  # now (STRICT unset below): flip to STRICT=1 once the signal has proven
  # stable across a handful of real runs, per tasks/PROGRESS.md.
  benchmark:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
    - name: Checkout head
      uses: actions/checkout@v4
      with:
        submodules: recursive
        path: pr

    - name: Determine base commit
      id: base
      run: |
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          echo "sha=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
        elif [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
          # First push of a new branch -- no prior commit on this ref to diff
          # against (git rev-parse HEAD^ inside the shallow `pr` checkout
          # would also fail here for the same reason: no parent was fetched).
          echo "sha=" >> "$GITHUB_OUTPUT"
        else
          echo "sha=${{ github.event.before }}" >> "$GITHUB_OUTPUT"
        fi

    - name: Checkout base commit
      if: steps.base.outputs.sha != ''
      uses: actions/checkout@v4
      with:
        submodules: recursive
        ref: ${{ steps.base.outputs.sha }}
        path: base

    - name: No base commit available
      if: steps.base.outputs.sha == ''
      run: echo "::notice::Skipping benchmark regression gate -- no prior commit on this ref to diff against (first push of a new branch)."

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake nasm jq

    - name: Build head
      run: |
        cmake -S pr/vendor/libjpeg-turbo -B pr/vendor/libjpeg-turbo/build -DCMAKE_BUILD_TYPE=Release -DENABLE_SHARED=OFF
        cmake --build pr/vendor/libjpeg-turbo/build --target turbojpeg-static -j
        cmake -S pr -B pr/build -DPHASH_BUILD_TESTS=ON -DPHASH_STRICT_DEPS=ON -DCMAKE_BUILD_TYPE=Release
        cmake --build pr/build --config Release -j

    - name: Build base
      if: steps.base.outputs.sha != ''
      run: |
        cmake -S base/vendor/libjpeg-turbo -B base/vendor/libjpeg-turbo/build -DCMAKE_BUILD_TYPE=Release -DENABLE_SHARED=OFF
        cmake --build base/vendor/libjpeg-turbo/build --target turbojpeg-static -j
        cmake -S base -B base/build -DPHASH_BUILD_TESTS=ON -DPHASH_STRICT_DEPS=ON -DCMAKE_BUILD_TYPE=Release
        cmake --build base/build --config Release -j

    - name: Run Benchmarks
      if: steps.base.outputs.sha != ''
      run: |
        echo "### Performance Benchmark" > benchmark_report.md
        echo '```text' >> benchmark_report.md
        ./pr/build/test_benchmark smoke >> benchmark_report.md
        echo '```' >> benchmark_report.md
        echo >> benchmark_report.md
        # 10% threshold: the harness's measured noise floor with min_ms is under
        # 7% on an idle machine (see docs/development.md). Still STRICT=0.
        bash pr/scripts/bench_regression_gate.sh \
          pr/build/test_benchmark base/build/test_benchmark 5 10 regression.md
        cat regression.md >> benchmark_report.md
        cat benchmark_report.md >> $GITHUB_STEP_SUMMARY

    - name: Post Performance Report
      if: github.event_name == 'pull_request' && steps.base.outputs.sha != ''
      uses: thollander/actions-comment-pull-request@v2
      with:
        filePath: benchmark_report.md
        comment_tag: performance_report

  # R34: LeakSanitizer is bundled into ASan by default on Linux (unlike macOS,
  # where it doesn't exist), so it already ran here -- detect_leaks=1 makes that
  # explicit instead of relying on an upstream default that could silently change.
  sanitizers:
    runs-on: ubuntu-latest
    env:
      CC: clang
      ASAN_OPTIONS: halt_on_error=1:detect_leaks=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake clang nasm

    - name: Build vendored TurboJPEG
      run: |
        cmake -S vendor/libjpeg-turbo -B vendor/libjpeg-turbo/build -DCMAKE_BUILD_TYPE=Release -DENABLE_SHARED=OFF -DCMAKE_C_COMPILER=clang
        cmake --build vendor/libjpeg-turbo/build --target turbojpeg-static -j

    - name: Configure CMake (ASan/UBSan)
      run: |
        cmake -B build -DPHASH_BUILD_TESTS=ON -DPHASH_STRICT_DEPS=ON -DCMAKE_BUILD_TYPE=Debug \
          -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=all" \
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

    - name: Build
      run: cmake --build build

    - name: Run Tests
      run: cd build && ctest --output-on-failure

  # R25/R35: the threaded batch path (src/batch.c) and the "one context per thread"
  # contract (include/libphash.h) are the two places in this codebase whose whole point
  # is concurrent access -- exactly what ASan/UBSan above cannot see. stb-only on
  # purpose: this job's job is thread-safety itself, not decoder coverage (already
  # exercised elsewhere), and skipping the vendored TurboJPEG build keeps it fast.
  tsan:
    runs-on: ubuntu-latest
    env:
      CC: clang
      TSAN_OPTIONS: halt_on_error=1
    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake clang

    - name: Configure CMake (TSan, stb_image only)
      run: >
        cmake -B build -DPHASH_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Debug
        -DPHASH_USE_TURBOJPEG=OFF -DPHASH_USE_LIBPNG=OFF -DPHASH_USE_WEBP=OFF -DPHASH_USE_ZLIB_NG=OFF
        -DCMAKE_C_FLAGS=-fsanitize=thread -DCMAKE_EXE_LINKER_FLAGS=-fsanitize=thread

    - name: Build
      run: cmake --build build --target test_batch --target test_batch_stress --target test_thread_safety -j

    - name: Run test_batch* and test_thread_safety
      run: |
        ./build/test_batch
        ./build/test_batch_stress
        ./build/test_thread_safety

  # R34: independent of ASan/LSan above (Valgrind and ASan don't mix -- ASan's own
  # shadow memory looks like a leak to Valgrind and vice versa), and it catches a
  # different class of memory error (e.g. uninitialized-read) that neither
  # sanitizer nor test_alloc_failure's own shim-based leak accounting covers.
  # stb-only + a fixed subset, not the whole matrix: Valgrind's own instrumentation
  # overhead makes a full run too slow for per-PR CI; this subset concentrates on
  # the allocation-heavy paths (loader, core, batch, the alloc-failure-injection
  # test itself) that R34 exists to guard.
  valgrind:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake valgrind

    - name: Configure CMake (stb_image only, no sanitizers)
      run: >
        cmake -B build -DPHASH_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Debug
        -DPHASH_USE_TURBOJPEG=OFF -DPHASH_USE_LIBPNG=OFF -DPHASH_USE_WEBP=OFF -DPHASH_USE_ZLIB_NG=OFF

    - name: Build
      run: >
        cmake --build build --target test_alloc_failure --target test_core
        --target test_core_extended --target test_loader --target test_batch
        --target test_pixel_count_overflow -j

    - name: Run subset under Valgrind
      run: |
        for t in test_alloc_failure test_core test_core_extended test_loader test_batch test_pixel_count_overflow; do
          valgrind --error-exitcode=1 --leak-check=full --errors-for-leak-kinds=all ./build/$t
        done

  fuzz:
    runs-on: ubuntu-latest
    env:
      CC: clang
      ASAN_OPTIONS: halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake clang nasm

    - name: Build vendored TurboJPEG
      run: |
        cmake -S vendor/libjpeg-turbo -B vendor/libjpeg-turbo/build -DCMAKE_BUILD_TYPE=Release -DENABLE_SHARED=OFF -DCMAKE_C_COMPILER=clang
        cmake --build vendor/libjpeg-turbo/build --target turbojpeg-static -j

    - name: Configure CMake (fuzzers)
      run: cmake -B build -DPHASH_BUILD_FUZZERS=ON -DPHASH_STRICT_DEPS=ON -DCMAKE_BUILD_TYPE=Debug

    - name: Build
      run: cmake --build build --target fuzz_load

    # R27: fuzz-corpus- (no run id) always misses on the save side and restores the
    # most recently saved cache on the restore side -- the corpus only ever grows,
    # so each run should pick up where the last one left off instead of starting
    # from zero every time (90s was finding nothing new run after run before this).
    - name: Restore fuzz corpus cache
      uses: actions/cache@v4
      with:
        path: tests/fuzz/corpus
        key: fuzz-corpus-${{ github.run_id }}
        restore-keys: |
          fuzz-corpus-

    - name: Run fuzz_load (short session on every PR)
      run: |
        mkdir -p /tmp/fuzz-artifacts tests/fuzz/corpus
        # tests/fuzz/corpus is the writable corpus libFuzzer saves new units into;
        # tests/data is passed second, as a read-only seed corpus -- swapping the
        # order would make libFuzzer write generated inputs straight into the
        # fixture directory (R27).
        ./build/fuzz_load -max_total_time=90 -dict=tests/fuzz/magic.dict \
          -artifact_prefix=/tmp/fuzz-artifacts/ tests/fuzz/corpus tests/data

    - name: Upload crash artifacts
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: fuzz-crashes
        path: /tmp/fuzz-artifacts/

  install-smoke-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake nasm pkg-config

    # -DCMAKE_POSITION_INDEPENDENT_CODE=ON: the smoke test below also builds a
    # SHARED libphash against this same archive. Unlike libpng/webp/zlib-ng
    # (pulled in via add_subdirectory(), which inherits this project's own -fPIC
    # from CMakeLists.txt), TurboJPEG is built as a fully separate CMake
    # invocation that never sees that flag -- without it, linking libphash.so
    # against libturbojpeg.a fails on Linux with "recompile with -fPIC". Found
    # during R42's release-workflow validation (same TurboJPEG-then-shared-link
    # shape as here), see tasks/review/PROGRESS.md.
    - name: Build vendored TurboJPEG
      run: |
        cmake -S vendor/libjpeg-turbo -B vendor/libjpeg-turbo/build -DCMAKE_BUILD_TYPE=Release -DENABLE_SHARED=OFF -DCMAKE_POSITION_INDEPENDENT_CODE=ON
        cmake --build vendor/libjpeg-turbo/build --target turbojpeg-static -j

    # cmake --install into a throwaway prefix + build a mini find_package(phash)
    # consumer against it (task 4). Exercises both the static and shared build.
    - name: Smoke-test install()/pkg-config/find_package(phash)
      run: |
        ./scripts/smoke_install.sh static
        ./scripts/smoke_install.sh shared
        # R11/H3 + R51: libphash must not reconfigure a parent that pulls it in
        # via add_subdirectory(), and the result must build and run -- with the
        # parent static or shared, and across a repeated configure of the same
        # build tree. Only an integration build can show that.
        ./scripts/smoke_add_subdirectory.sh
