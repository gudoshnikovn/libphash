name: CI

# Triggers, and what each one is actually good for:
#
#  - push to main: the shipped default branch.
#  - push to release/**: how a release branch gets validated. Feature branches
#    merge into release/** via local rebase + `git merge --ff-only`, never a
#    GitHub PR, so without this trigger nothing on a release
#    branch is ever built by CI. It does mean the full matrix runs on every
#    feature merge, which is the point -- and the cost is runner time, not
#    money: this repository is public and on standard runners, so every leg
#    bills zero (a full run is ~4.5 minutes wall clock, ~26 job-minutes).
#  - pull_request against main or release/**: for a `pull_request` event GitHub
#    takes the workflow from the merge ref, so a draft PR validates a branch
#    whose workflow changes have not landed anywhere yet.
#  - workflow_dispatch: registered by GitHub from the *default branch* copy of
#    this file only. It works only when the default branch's copy of this file
#    declares it; on any other branch, use one of the triggers above.
on:
  push:
    branches: [ main, 'release/**' ]
  pull_request:
    branches: [ main, 'release/**' ]
  workflow_dispatch:
    inputs:
      bench_base_ref:
        description: Branch, tag or commit the benchmark job compares against
        required: false
        default: main

# Every ctest run fills the runner's four vCPUs: the tests share no files and do not
# depend on timing. CMakeLists.txt schedules them -- a test that starts its own threads
# runs alone, the longest start first.
env:
  CTEST_PARALLEL_LEVEL: 4

# Read-only by default; the one job that writes (benchmark's PR comment) asks for it.
permissions:
  contents: read

# A newer push to the same ref makes the running matrix moot.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Every job has a timeout-minutes about three times its usual duration with a cold
# ccache, so a hung test fails in minutes instead of holding a runner for GitHub's
# default six hours.
#
# Linux legs name an exact image (ubuntu-24.04), not ubuntu-latest: the coverage
# thresholds and warning gates are measured against that image's compilers, and a
# moving label would change them underneath the gates.
jobs:
  # Fast, no submodules/build needed -- catches an unformatted diff before
  # the much slower legs below spend minutes on it. scripts/format.sh is the same
  # script `make format` runs, so the perimeter and the clang-format major cannot
  # drift apart between the two.
  #
  # clang-format comes from PyPI at an exact version, not from apt: the runner
  # image's clang-format is whatever major that image ships, and a different major
  # formats differently -- the job would turn red on unchanged code the day the
  # image moved. setup-python rather than the system pip, which Ubuntu 24.04 marks
  # externally managed (PEP 668) and refuses to install into.
  format-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.x'

    - name: Install clang-format (pinned)
      run: pip install clang-format==23.1.1

    - name: clang-format --dry-run --Werror (scripts/format.sh --check)
      run: ./scripts/format.sh --check

    - name: Check documentation coverage
      run: bash scripts/check_docs_coverage.sh

    # Tracked text states what the library is and why, never how it got there: no
    # tracker ids, no paths into local planning notes, no release-cycle wording.
    # Advisory hits ("used to", "again", ...) are printed for review, not failed on.
    - name: Check tracked text for process references
      run: bash scripts/check_final_state_voice.sh

    # The runner image ships shellcheck. Warnings and errors fail the step; its
    # info-level notes (an unquoted $PKG_FLAGS that is split on purpose, a literal
    # '${prefix}') do not.
    - name: shellcheck scripts/
      run: shellcheck --severity=warning scripts/*.sh

    # Explicit casts per file in src/ against scripts/explicit_casts.txt: an added or
    # removed cast fails until the list is updated in the same change, so every one is
    # visible in review (docs/development.md, "Conversions and casts").
    - name: Explicit casts as recorded
      run: python3 scripts/check_casts.py

    - name: Coverage thresholds as documented
      run: python3 scripts/check_coverage.py --check-docs

    # Each copied-in stb header is its recorded upstream commit plus the patch in
    # vendor/patches/, byte for byte. Downloads the two upstream files.
    - name: Vendored stb headers = upstream + vendor/patches
      run: ./scripts/check_stb_patches.sh

  # Full vendored build (all bundled decoders) across the platforms/arches we
  # actually ship for. PHASH_STRICT_DEPS=ON turns a silent decoder fallback
  # (e.g. a vendored submodule not checked out) into a hard configure failure, so a CI green
  # here means the vendored decoders were genuinely built and linked, not
  # quietly swapped for stb_image.
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-x86_64-gcc
            os: ubuntu-24.04
            needs_nasm: true
            cc: gcc
            preset: release
          - name: ubuntu-x86_64-clang
            os: ubuntu-24.04
            needs_nasm: true
            cc: clang
            preset: release
          # Half of every release's archives are the shared library. In this build the
          # tests that use only the public API link libphash.so itself (CMakeLists.txt).
          - name: ubuntu-x86_64-gcc-shared
            os: ubuntu-24.04
            needs_nasm: true
            cc: gcc
            preset: shared
          - name: ubuntu-arm64-gcc
            os: ubuntu-24.04-arm
            needs_nasm: false
            cc: gcc
            preset: release
          - name: macos-arm64-clang
            os: macos-latest
            needs_nasm: false
            cc: clang
            preset: release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    name: build-and-test (${{ matrix.name }})
    env:
      CC: ${{ matrix.cc }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - uses: ./.github/actions/setup-build
      with:
        ccache: 'true'
        ccache-key: ${{ matrix.name }}
        apt-packages: cmake${{ matrix.needs_nasm && ' nasm' || '' }}${{ matrix.cc == 'clang' && ' clang' || '' }}

    - name: Configure CMake (full vendored build)
      run: cmake --preset ${{ matrix.preset }}

    - name: Build
      run: cmake --build --preset ${{ matrix.preset }} -j

    - name: Run Tests
      run: ctest --preset ${{ matrix.preset }}

    # The linked result carries the decoders the build tree asked for, statically, with
    # one zlib (zlib-ng) and no codec the library does not use. Every CMake job below
    # runs the same step on its own tree.
    - name: Check decoder symbols
      run: ./scripts/check_decoder_symbols.sh build/${{ matrix.preset }}/test_png_variants

    # Apple's ar and ranlib take ZERO_AR_DATE rather than D; install-smoke-test covers
    # the GNU side.
    - name: Reproducible builds (macOS toolchain)
      if: runner.os == 'macOS'
      run: |
        ./scripts/check_reproducible.sh cmake
        ./scripts/check_reproducible.sh make

  # The windows-x86_64 release archives are this configuration -- every vendored decoder,
  # built by MSVC -- and this is where it is built and tested before a tag. NASM for
  # libjpeg-turbo's x86-64 SIMD, as in release.yml. No decoder-symbol step: the check
  # reads ELF and Mach-O.
  build-and-test-windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - uses: ./.github/actions/setup-build
      with:
        apt-packages: ''
        brew-packages: ''

    - name: Install NASM
      shell: bash
      run: |
        choco install nasm --no-progress -y
        echo "C:\\Program Files\\NASM" >> "$GITHUB_PATH"

    - name: Configure CMake (full vendored build, MSVC)
      run: cmake --preset release

    - name: Build
      run: cmake --build --preset release -j

    - name: Run Tests
      run: ctest --preset release

  # Build options no other job turns: PHASH_ENABLE_THREADS=OFF (the batch API's
  # sequential path, for a platform without threads) and PHASH_ENABLE_MOCK_BACKEND=ON
  # (the test-only DE AD decoder, which no shipped build has, and the test branches
  # written for it). Neither depends on a decoder, so both build stb_image only.
  # PHASH_OPTIMIZE_NATIVE has no job: -march=native compiles for whatever CPU the runner
  # happens to have, so a result would describe that machine, not the option.
  build-options:
    strategy:
      fail-fast: false
      matrix:
        preset: [no-threads, mock-backend]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    name: build-options (${{ matrix.preset }})
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - uses: ./.github/actions/setup-build
      with:
        submodules: 'false'

    - name: Configure CMake
      run: cmake --preset ${{ matrix.preset }}

    - name: Build
      run: cmake --build --preset ${{ matrix.preset }} -j

    - name: Run Tests
      run: ctest --preset ${{ matrix.preset }}

    - name: Check decoder symbols
      run: ./scripts/check_decoder_symbols.sh build/${{ matrix.preset }}/test_png_variants

  # Warnings as errors on the project's own code -- library, tests, fuzzer, benchmark --
  # and never on the vendored decoders (PHASH_WARNINGS_AS_ERRORS). A job of its own
  # rather than a flag on every build: a build from source must not fail because a newer
  # compiler warns about something new, so the other builds tolerate warnings and this
  # is where a new one turns red. Both compilers, since each has warnings the other does
  # not (GCC's -Wclobbered, for one).
  strict-warnings:
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    name: strict-warnings (${{ matrix.cc }})
    env:
      CC: ${{ matrix.cc }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - uses: ./.github/actions/setup-build
      with:
        ccache: 'true'
        ccache-key: ${{ matrix.cc }}
        apt-packages: cmake nasm${{ matrix.cc == 'clang' && ' clang clang-tidy' || '' }}

    - name: Configure CMake (full vendored build, -Werror on libphash's own targets)
      run: cmake --preset strict-warnings

    - name: Build
      run: cmake --build --preset strict-warnings -j

    - name: Run Tests
      run: ctest --preset strict-warnings

    - name: Check decoder symbols
      run: ./scripts/check_decoder_symbols.sh build/strict-warnings/test_png_variants

    # A cast applied to the result of an arithmetic that has already overflowed in the
    # narrower type -- (uint64_t)(a * b) on ints -- widens nothing. No compiler warning
    # sees it; this clang-tidy check does.
    - name: clang-tidy bugprone-misplaced-widening-cast
      if: matrix.cc == 'clang'
      run: >
        git ls-files 'src/*.c' | grep -v '/stb_' |
        xargs clang-tidy -p build/strict-warnings --quiet --checks='-*,bugprone-misplaced-widening-cast'
        --warnings-as-errors='*'

  # `make coverage` (Makefile) only measures the stb_image-only path -- none
  # of the native decoding code in src/loaders/ (jpeg.c and webp.c compile to nothing
  # there, and png_libpng.c is not built) exists in that binary. This job runs
  # scripts/coverage_cmake.sh, which drives the vendored decoder build under
  # -DPHASH_COVERAGE=ON, then publishes the HTML report as an artifact. See
  # docs/development.md#two-coverage-targets-and-why-one-isnt-enough.
  coverage-cmake:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - uses: ./.github/actions/setup-build
      with:
        ccache: 'true'
        apt-packages: cmake nasm lcov

    - name: Run coverage-cmake
      run: ./scripts/coverage_cmake.sh

    # The one place coverage is a gate: thresholds per area, lines and branches, in
    # scripts/coverage_thresholds.txt (docs/development.md, "Coverage standard").
    - name: Coverage thresholds
      run: python3 scripts/check_coverage.py docs/coverage/cmake/native.info

    - name: Upload coverage report
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: coverage-cmake-html
        path: docs/coverage/cmake/html/
        retention-days: 14

  # Zero-dependency build: every PHASH_USE_* backend off, stb_image only.
  minimal-build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    name: minimal-build (${{ matrix.os }})
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    # Nothing to install: cmake ships on all three runner images. No submodules either:
    # this job is a clone without --recursive, configured with the default options.
    - uses: ./.github/actions/setup-build
      with:
        submodules: 'false'
        apt-packages: ''
        brew-packages: ''

    # The configure names every missing decoder submodule in one warning, with the
    # command that fetches them, and builds stb_image only. CMake wraps the warning's
    # lines, so the log is flattened before matching.
    - name: Configure CMake (no submodules, default options -> stb_image only)
      shell: bash
      run: |
        cmake -B build -DPHASH_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Release 2>&1 | tee configure.log
        flat="$(tr -s ' \r\n' ' ' < configure.log)"
        grep -qF 'not checked out: vendor/libjpeg-turbo, vendor/libpng, vendor/libwebp, vendor/zlib-ng.' <<<"$flat"
        grep -qF 'git submodule update --init --recursive' <<<"$flat"

    - name: PHASH_STRICT_DEPS=ON refuses the same tree
      shell: bash
      run: |
        if cmake -B build-strict -DPHASH_STRICT_DEPS=ON > strict.log 2>&1; then
          echo "::error::configure succeeded without the submodules under PHASH_STRICT_DEPS=ON"
          exit 1
        fi
        flat="$(tr -s ' \r\n' ' ' < strict.log)"
        grep -qF 'not checked out: vendor/libjpeg-turbo, vendor/libpng, vendor/libwebp, vendor/zlib-ng.' <<<"$flat"

    - name: Build
      run: cmake --build build --config Release

    - name: Run Tests
      env:
        PH_EXPECT_BUILD: jpeg=stb png=stb webp=none zlib=none
      run: cd build && ctest -C Release --output-on-failure

    # nm/readelf/otool: the check reads ELF and Mach-O.
    - name: Check decoder symbols
      if: runner.os != 'Windows'
      run: ./scripts/check_decoder_symbols.sh build/test_png_variants

  # Confirms the code actually compiles and passes under each standard the
  # project's CMAKE_C_STANDARD default (C17, see CMakeLists.txt) could plausibly
  # move between -- most importantly C23, which isn't the default yet only
  # because windows-latest/MSVC's C23 support is still too immature to trust in
  # the main matrix. No windows-latest here on purpose: this leg exists to watch
  # for that gap closing, not to re-test something MSVC already covers at C17.
  # Minimal build (stb_image only) since the standard is what's under test, not
  # the vendored decoders -- those are already exercised at C17 elsewhere, by
  # build-and-test, which is where the full vendored set meets glibc under the
  # strict -std=c17 dialect. Repeating that set here at three standards would
  # triple the vendored builds to prove a property of the vendored code, not of ours.
  #
  # gcc-14, not the runner's default gcc: ubuntu-24.04 ships GCC 13, whose -std=c2x
  # reports __STDC_VERSION__ 202000L rather than 202311L, so a "C23" job on it never
  # compiles the public header's C23-only branches. 14 is the first GCC that is
  # actually C23.
  c-standard-matrix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
        std: [11, 17, 23]
        cc: [gcc-14, clang]
        exclude:
          # macOS gcc is a clang shim in disguise -- redundant with the clang leg.
          - os: macos-latest
            cc: gcc-14
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    name: c-standard (${{ matrix.os }}, ${{ matrix.cc }}, C${{ matrix.std }})
    env:
      CC: ${{ matrix.cc }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - uses: ./.github/actions/setup-build
      with:
        apt-packages: cmake ${{ matrix.cc }}

    # The build below already compiles src/ and tests/src/ under the strict dialect,
    # but only names the symptom ("'M_PI' undeclared") and never sees examples/ at
    # all. This sweep covers every translation unit in the repository, names the
    # class, and costs seconds -- worth having as its own step because the failure it
    # guards is invisible on the machine most of this code is written on: a strict
    # dialect defines __STRICT_ANSI__, glibc then hides every non-ISO declaration,
    # and Darwin's libc hides nothing.
    - name: Strict ISO syntax sweep (src/, tests/src/, examples/)
      run: ./scripts/check_strict_iso.sh ${{ matrix.std }}

    # The consumer's view of the same question: a TU that includes only libphash.h
    # must compile warning-free, and PH_NODISCARD must still fire. The sweep above
    # would catch a header that fails to parse, but as one error per file per
    # declaration without naming why, and it cannot see an attribute that is
    # silently ignored -- which is a warning, not an error.
    - name: Public header check (self-contained, PH_NODISCARD live)
      run: ./scripts/check_public_header.sh ${{ matrix.std }}

    - name: Configure CMake (minimal, stb_image only)
      run: >
        cmake --preset minimal
        -DCMAKE_C_STANDARD=${{ matrix.std }} -DCMAKE_C_STANDARD_REQUIRED=ON

    - name: Build
      run: cmake --build --preset minimal

    - name: Run Tests
      run: ctest --preset minimal

    - name: Check decoder symbols
      run: ./scripts/check_decoder_symbols.sh build/minimal/test_png_variants

  # Overflow bugs (e.g. pixel-count overflow, PNG row_ptrs overflow) trigger at much
  # smaller inputs on a 32-bit size_t/int than on 64-bit, which no other leg
  # exercises. Scoped to the
  # native PNG backend (libpng) plus system zlib, not the full vendored set: cross-
  # building libjpeg-turbo/zlib-ng's own NASM-based 32-bit SIMD and libwebp under -m32
  # is a much larger, separate lift, and this backend already links the one native
  # decoder (src/loaders/png_libpng.c) whose overflow guards this leg exists to exercise.
  #
  # -Werror=incompatible-pointer-types belongs on this leg specifically: a decoder
  # declared with `unsigned long` where the backend table expects `size_t` is the same
  # type on every LP64 target the rest of the matrix runs on, so only a build where the
  # two differ can see the mismatch at all. GCC 14 promoted this diagnostic to an error
  # by default; pinning it here keeps the class caught on the runner's GCC 13 too.
  build-and-test-32bit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Install 32-bit toolchain and zlib
      uses: ./.github/actions/setup-build
      with:
        ccache: 'true'
        apt-architectures: i386
        apt-packages: cmake gcc-multilib g++-multilib zlib1g-dev:i386

    - name: Configure CMake (32-bit, libpng)
      run: cmake --preset i686

    - name: Build
      run: cmake --build --preset i686 -j

    - name: Confirm this is actually a 32-bit build
      run: file build/i686/test_version | grep -q "ELF 32-bit"

    - name: Run Tests
      run: ctest --preset i686

    - name: Check decoder symbols
      run: ./scripts/check_decoder_symbols.sh build/i686/test_png_variants

  # The full vendored build in a container that has a compiler, cmake and nasm and no
  # library headers at all. A runner image ships zlib, libpng and friends as -dev
  # packages, so a vendored decoder that quietly compiles against a system header, or a
  # target that needs one built before it without saying so, still passes everywhere
  # else. One target is built on its own in a fresh tree, which is where a missing
  # build-order dependency shows.
  bare-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container: ubuntu:24.04
    steps:
    # git before the checkout, so it is a repository the submodules can be fetched into.
    - name: Install compiler, cmake, nasm, git -- nothing else
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        apt-get update
        apt-get install -y --no-install-recommends gcc libc6-dev cmake make nasm git ca-certificates
        for h in zlib.h png.h jpeglib.h webp/decode.h; do
          if [ -e "/usr/include/$h" ]; then
            echo "::error::/usr/include/$h exists: this image is not bare"
            exit 1
          fi
        done

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    # The container runs as root over a workspace owned by the runner user.
    - name: Trust the workspace
      run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

    - uses: ./.github/actions/setup-build
      with:
        apt-packages: ''

    - name: Configure CMake (full vendored build)
      run: cmake --preset release

    - name: Build test_golden_hashes and test_build_info only
      run: cmake --build --preset release -j --target test_golden_hashes --target test_build_info

    - name: Run them
      run: ctest --preset release -R '^(test_golden_hashes|test_build_info)$'

    - name: Check decoder symbols
      run: ./scripts/check_decoder_symbols.sh build/release/test_golden_hashes

  # Builds the head and a base commit in this same job and compares their
  # benchmark numbers (scripts/bench_regression_gate.sh), so runner noise hits
  # both sides alike instead of being measured against hardcoded numbers. The
  # base is what the event offers as "before this change":
  #  - pull_request: the PR's base commit;
  #  - push: the previous tip of the pushed ref (release branches take
  #    fast-forwarded feature branches, so this is the commit before the push);
  #  - workflow_dispatch: the bench_base_ref input, `main` by default.
  # A push that creates a ref has no previous tip and skips the comparison.
  benchmark:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    timeout-minutes: 20
    steps:
    - name: Checkout head
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        path: pr

    - name: Determine base commit
      id: base
      env:
        EVENT: ${{ github.event_name }}
        PR_BASE: ${{ github.event.pull_request.base.sha }}
        BEFORE: ${{ github.event.before }}
        DISPATCH_BASE: ${{ inputs.bench_base_ref }}
      run: |
        case "$EVENT" in
          pull_request) echo "ref=$PR_BASE" >> "$GITHUB_OUTPUT" ;;
          workflow_dispatch) echo "ref=${DISPATCH_BASE:-main}" >> "$GITHUB_OUTPUT" ;;
          *)
            # A push that creates the ref reports an all-zero "before": there is
            # no previous tip to compare against.
            if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              echo "ref=" >> "$GITHUB_OUTPUT"
            else
              echo "ref=$BEFORE" >> "$GITHUB_OUTPUT"
            fi
            ;;
        esac

    - name: Checkout base commit
      if: steps.base.outputs.ref != ''
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        ref: ${{ steps.base.outputs.ref }}
        path: base

    - name: No base commit available
      if: steps.base.outputs.ref == ''
      run: echo "::notice::Skipping benchmark regression gate -- this push created the ref, so there is no previous tip to compare against."

    # The head's copy of the action serves both trees: the base commit may predate
    # it, and the prologue is not what this job compares.
    - name: Set up head (submodules + dependencies)
      uses: ./pr/.github/actions/setup-build
      with:
        ccache: 'true'
        path: pr
        apt-packages: cmake nasm jq

    - name: Set up base (submodules)
      if: steps.base.outputs.ref != ''
      uses: ./pr/.github/actions/setup-build
      with:
        path: base
        apt-packages: ''

    - name: Build head
      run: |
        cmake -S pr -B pr/build -DPHASH_BUILD_TESTS=ON -DPHASH_STRICT_DEPS=ON -DCMAKE_BUILD_TYPE=Release
        cmake --build pr/build --config Release -j

    - name: Build base
      if: steps.base.outputs.ref != ''
      run: |
        cmake -S base -B base/build -DPHASH_BUILD_TESTS=ON -DPHASH_STRICT_DEPS=ON -DCMAKE_BUILD_TYPE=Release
        cmake --build base/build --config Release -j

    - name: Run Benchmarks
      if: steps.base.outputs.ref != ''
      run: |
        {
          echo "### Performance Benchmark"
          echo '```text'
          ./pr/build/bench_hash smoke
          echo '```'
          echo
        } > benchmark_report.md
        # Thresholds: the script's defaults, 10% per metric and 5% on the median
        # change; docs/development.md has the noise floor they are read against.
        # STRICT=1: a flagged regression fails the job, after the report is
        # published below -- a red job without its table would say nothing.
        # A base tree that does not build bench_hash has nothing to compare against.
        gate=0
        if [ -x base/build/bench_hash ]; then
          STRICT=1 bash pr/scripts/bench_regression_gate.sh \
            pr/build/bench_hash base/build/bench_hash 5 10 regression.md || gate=$?
          cat regression.md >> benchmark_report.md
        else
          echo "::notice::The base commit does not build bench_hash; no regression comparison."
        fi
        cat benchmark_report.md >> "$GITHUB_STEP_SUMMARY"
        exit "$gate"

    # Downloadable alongside the $GITHUB_STEP_SUMMARY copy above -- the summary
    # disappears once you're not looking at this specific run's page, an artifact
    # survives to be diffed against a later run's or pulled into a script. It
    # runs after a failed gate too: the report is what explains the failure.
    - name: Upload benchmark report
      if: ${{ !cancelled() && steps.base.outputs.ref != '' && hashFiles('benchmark_report.md') != '' }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: benchmark-report
        path: benchmark_report.md
        retention-days: 90

    - name: Post Performance Report
      if: ${{ !cancelled() && github.event_name == 'pull_request' && steps.base.outputs.ref != '' && hashFiles('benchmark_report.md') != '' }}
      # gh rather than a marketplace action: no third-party JavaScript runtime to
      # keep current. The bot's previous report is edited in place, not stacked.
      env:
        GH_TOKEN: ${{ github.token }}
      run: >
        gh pr comment ${{ github.event.pull_request.number }}
        --repo ${{ github.repository }} --body-file benchmark_report.md
        --edit-last --create-if-none

  # LeakSanitizer is part of ASan by default on Linux (not on macOS, where it
  # doesn't exist); detect_leaks=1 states it explicitly instead of relying on an
  # upstream default that could silently change.
  sanitizers:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CC: clang
      ASAN_OPTIONS: halt_on_error=1:detect_leaks=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - uses: ./.github/actions/setup-build
      with:
        ccache: 'true'
        apt-packages: cmake clang nasm

    - name: Configure CMake (ASan/UBSan)
      run: cmake --preset asan

    - name: Build
      run: cmake --build --preset asan -j

    - name: Run Tests
      run: ctest --preset asan

    - name: Check decoder symbols
      run: ./scripts/check_decoder_symbols.sh build/asan/test_png_variants

  # The threaded batch path (src/batch.c) and the "one context per thread"
  # contract (include/libphash.h) are the two places in this codebase whose whole point
  # is concurrent access -- exactly what ASan/UBSan above cannot see.
  #
  # Three configurations. stb-only is a shipped configuration (minimal-build). The two
  # native-PNG ones exist because the native decoders bring their own shared state:
  # zlib-ng initialises its CPU dispatch table lazily and unsynchronised, which would race
  # on the first parallel PNG decodes if the loader did not warm it once
  # (test_cold_parallel_decode is the test that sees it -- the other thread tests decode
  # a sequential reference first and warm it by accident). The full-native leg adds the
  # JPEG decoder: libjpeg-turbo's libjpeg archive (jpeg-static), built inside the build
  # tree with the same C flags, so TSan instruments libjpeg-turbo's C code as well as
  # libphash's side of the JPEG path (its SIMD assembly is not instrumented).
  tsan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: stb-only
            submodules: 'false'
            preset: tsan-stb
          - name: libpng-zlibng-webp
            submodules: 'true'
            preset: tsan-png
          - name: full-native
            submodules: 'true'
            preset: tsan
    name: tsan (${{ matrix.name }})
    env:
      CC: clang
      TSAN_OPTIONS: halt_on_error=1
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - uses: ./.github/actions/setup-build
      with:
        ccache: 'true'
        ccache-key: ${{ matrix.name }}
        submodules: ${{ matrix.submodules }}
        apt-packages: cmake clang nasm

    - name: Configure CMake (TSan)
      run: cmake --preset ${{ matrix.preset }}

    - name: Build
      run: >
        cmake --build --preset ${{ matrix.preset }} -j --target test_cold_parallel_decode --target test_batch
        --target test_batch_stress --target test_thread_safety

    # One at a time: each of these starts a thread per core of its own.
    - name: Run the thread tests
      run: |
        ./build/${{ matrix.preset }}/test_cold_parallel_decode
        ./build/${{ matrix.preset }}/test_batch
        ./build/${{ matrix.preset }}/test_batch_stress
        ./build/${{ matrix.preset }}/test_thread_safety

    - name: Check decoder symbols
      run: ./scripts/check_decoder_symbols.sh build/${{ matrix.preset }}/test_cold_parallel_decode

  # Independent of ASan/LSan above (Valgrind and ASan don't mix -- ASan's own
  # shadow memory looks like a leak to Valgrind and vice versa), and it catches a
  # different class of memory error (e.g. uninitialized-read) that neither
  # sanitizer nor test_alloc_failure's own shim-based leak accounting covers.
  # It is also the only job where test_alloc_failure injects anything under a memory
  # checker: its allocator shim stands down under ASan (tests/src/alloc_shim.h), so in
  # the sanitizers job that test passes without running a single scenario.
  #
  # Two legs, a fixed subset each: Valgrind's instrumentation overhead makes the whole
  # suite too slow for every CI run.
  #  - stb-only concentrates on the allocation-heavy paths of the library itself
  #    (loader, core, batch, the alloc-failure-injection test).
  #  - native fails allocations inside libjpeg-turbo, libpng and libwebp -- the
  #    injection points the stb-only build does not have -- and checks that each
  #    failure is reported and leaks nothing.
  valgrind:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: stb-only
            preset: minimal-debug
            submodules: 'false'
            ccache: 'false'
            tests: test_alloc_failure test_api_guards test_core_extended test_loader test_batch test_pixel_count_overflow
          - name: native
            preset: debug
            submodules: 'true'
            ccache: 'true'
            tests: test_alloc_failure test_loader
    name: valgrind (${{ matrix.name }})
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - uses: ./.github/actions/setup-build
      with:
        ccache: ${{ matrix.ccache }}
        ccache-key: ${{ matrix.name }}
        submodules: ${{ matrix.submodules }}
        apt-packages: cmake valgrind

    - name: Configure CMake
      run: cmake --preset ${{ matrix.preset }}

    - name: Build
      env:
        TESTS: ${{ matrix.tests }}
      run: |
        targets=()
        for t in $TESTS; do targets+=(--target "$t"); done
        cmake --build --preset ${{ matrix.preset }} -j "${targets[@]}"

    # somalloc=nouserintercepts: Valgrind replaces malloc() in libc only, not the one
    # test_alloc_failure defines in the executable, so the test's allocator shim sees
    # every call (and forwards it to libc, where Valgrind tracks it). Without it the
    # shim sees nothing and the test skips; PH_EXPECT_ALLOC_SHIM=1 makes that skip a
    # failure.
    - name: Run subset under Valgrind
      env:
        TESTS: ${{ matrix.tests }}
        PH_EXPECT_ALLOC_SHIM: 1
      run: |
        for t in $TESTS; do
          echo "valgrind --soname-synonyms=somalloc=nouserintercepts --error-exitcode=1 --leak-check=full --errors-for-leak-kinds=all ./build/${{ matrix.preset }}/$t"
        done | scripts/run_parallel.sh 4

    - name: Check decoder symbols
      run: ./scripts/check_decoder_symbols.sh build/${{ matrix.preset }}/test_loader

  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CC: clang
      ASAN_OPTIONS: halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - uses: ./.github/actions/setup-build
      with:
        ccache: 'true'
        apt-packages: cmake clang nasm

    - name: Configure CMake (fuzzers)
      run: cmake --preset fuzz

    - name: Build
      run: cmake --build --preset fuzz --target fuzz_load

    # The working corpus lives in the Actions cache. The key ends in the run id, so it
    # never matches on restore; restore-keys then picks the newest fuzz-corpus-* entry
    # this run can see -- its own branch's, or the default branch's, where the nightly
    # run saves -- and the run starts from what earlier runs found. The cache action
    # saves the directory under this run's key when the job ends.
    - name: Restore fuzz corpus cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: tests/fuzz/corpus
        key: fuzz-corpus-${{ github.run_id }}
        restore-keys: |
          fuzz-corpus-

    - name: Run fuzz_load (90 s session)
      run: |
        mkdir -p /tmp/fuzz-artifacts tests/fuzz/corpus
        # tests/fuzz/corpus is the writable corpus libFuzzer saves new units into;
        # tests/fuzz/seeds is passed second, read-only -- swapping the order would make
        # libFuzzer write generated inputs into the tracked seeds. -max_len: 64 KiB is
        # above every seed, and longer inputs reach no parsing code a shorter one does
        # not -- they only make each iteration slower.
        ./build/fuzz/fuzz_load -max_total_time=90 -max_len=65536 -dict=tests/fuzz/magic.dict \
          -artifact_prefix=/tmp/fuzz-artifacts/ tests/fuzz/corpus tests/fuzz/seeds

    # Keep only the inputs that add coverage, so the saved corpus stays the size of what
    # it covers instead of growing by every unit each run adds.
    - name: Minimize the corpus
      run: |
        mkdir -p /tmp/corpus-min
        ./build/fuzz/fuzz_load -merge=1 -max_len=65536 /tmp/corpus-min tests/fuzz/corpus
        echo "corpus: $(find tests/fuzz/corpus -type f | wc -l) units, $(find /tmp/corpus-min -type f | wc -l) after -merge=1"
        rm -rf tests/fuzz/corpus
        mv /tmp/corpus-min tests/fuzz/corpus

    - name: Upload crash artifacts
      if: failure()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: fuzz-crashes
        path: /tmp/fuzz-artifacts/

  install-smoke-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - uses: ./.github/actions/setup-build
      with:
        ccache: 'true'
        apt-packages: cmake nasm pkg-config

    # cmake --install into a throwaway prefix + build a mini find_package(phash)
    # consumer against it. Exercises both the static and shared build.
    - name: Smoke-test install()/pkg-config/find_package(phash)
      run: |
        ./scripts/smoke_install.sh static
        ./scripts/smoke_install.sh shared
        ./scripts/smoke_make_install.sh
        # libphash must not reconfigure a parent that pulls it in via
        # add_subdirectory(), and the result must build and run -- with the
        # parent static or shared, and across a repeated configure of the same
        # build tree. Only an integration build can show that.
        ./scripts/smoke_add_subdirectory.sh

    # The shared library exports include/libphash.h and nothing else -- not the
    # internal ph_* helpers, not stb_image, not the vendored decoders it links.
    - name: Check the shared library's exported symbols
      run: ./scripts/check_exported_symbols.sh

    # Two builds of the same sources give byte-identical static archives, install trees
    # and release archives, so a published archive can be rebuilt and checked against
    # SHA256SUMS.txt.
    - name: Reproducible builds (CMake install trees, Makefile archive, release archives)
      run: |
        ./scripts/check_reproducible.sh cmake
        ./scripts/check_reproducible.sh make
        ./scripts/check_reproducible.sh package linux-x86_64

    - name: Build and run examples/
      run: ./scripts/build_examples.sh
