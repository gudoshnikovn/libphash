name: Site

# The documentation site, built as `make site` builds it, and published to GitHub Pages
# (https://gudoshnikovn.github.io/libphash/) by a release: the push of a `v*` tag, the
# event release.yml publishes the archives on, so the published site describes the latest
# release. A pre-release tag (one containing `-`) publishes nothing, and no push to a
# branch runs the workflow: a build measures every figure again whenever the library's
# sources change. "Run workflow" in the Actions tab builds the site on the branch chosen
# there and uploads it as an artifact; on `main` the same run publishes it again.
#
# The build is strict: scripts/site.sh fails on a broken link or anchor, a page missing
# from the navigation, an included file that does not exist or a figure whose stages
# disagree with the library. The script is the only way in: zensical.toml is the
# configuration `zensical serve` reads, and the strict build runs on a copy of it that
# the script writes.
#
# GitHub offers "Run workflow" for a workflow only when its file is on the default branch.
on:
  push:
    tags: ['v*', '!v*-*']
  workflow_dispatch:

# Read-only by default: only the deploy job writes, and only to Pages.
permissions:
  contents: read

# A newer build of a branch replaces an older one. A run that publishes is never
# cancelled: an interrupted deploy is worse than a late one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' && github.ref != 'refs/heads/main' }}

jobs:
  # Python 3.12, the oldest the site supports, from setup-python: the lock in
  # scripts/site-requirements.txt is compiled for every platform from 3.12 on, and the
  # script installs it with pip and --require-hashes. The photo corpus is fetched first,
  # in a step of its own that fails unless every photograph in the manifest arrives and
  # matches its digest (it comes from a fixed commit of libphash-site-corpus, one archive);
  # a local build without a network goes on with fewer, and the site CI builds never does.
  # The measurements are kept in the Actions cache only to save time: each one in
  # build/site-cache/ is keyed on what decides it -- the library, the tool, the corpus
  # and, for a time, the machine -- so a change to the library measures everything again.
  site:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - uses: ./.github/actions/setup-build
      with:
        ccache: 'true'
        apt-packages: cmake nasm

    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: scripts/site-requirements.txt

    - name: Install Doxygen (pinned)
      run: |
        ./scripts/install_doxygen.sh "$RUNNER_TEMP/doxygen"
        echo "$RUNNER_TEMP/doxygen/bin" >> "$GITHUB_PATH"

    - name: Fetch the photo corpus (every photograph, or fail)
      run: python3 tools/site/fetch_corpus.py fetch --strict >/dev/null

    - name: Restore the measurements
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: build/site-cache
        key: site-measurements-${{ runner.arch }}-${{ github.sha }}
        restore-keys: site-measurements-${{ runner.arch }}-

    - name: Documentation site (make site)
      run: ./scripts/site.sh

    - name: Upload the site
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: site-html
        path: build/site/
        retention-days: 14

    - name: Upload the site for Pages
      if: github.ref_type == 'tag' || github.ref == 'refs/heads/main'
      uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
      with:
        path: build/site/

  # The repository's Settings -> Pages -> Source is "GitHub Actions"; the github-pages
  # environment is the one GitHub creates for it, and its URL is the site's. The
  # environment deploys from the branch `main` and from tags `v*`. Two deploys queue one
  # after the other, whatever ref started them.
  deploy:
    if: github.ref_type == 'tag' || github.ref == 'refs/heads/main'
    concurrency:
      group: pages
      cancel-in-progress: false
    needs: site
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
