  <rect x="2" y="23" width="6" height="6" rx="1.2" fill="#2a78d6" fill-opacity="0.28"/>
  <rect x="9" y="23" width="6" height="6" rx="1.2" fill="#2a78d6"/>
  <rect x="16" y="23" width="6" height="6" rx="1.2" fill="#2a78d6" fill-opacity="0.28"/>
  <rect x="23" y="23" width="6" height="6" rx="1.2" fill="#2a78d6" fill-opacity="0.28"/>
